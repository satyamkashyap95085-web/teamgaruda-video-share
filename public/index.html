<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Garuda Video Share</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; margin: 0; min-height: 100vh; }
    h1, h2 { color: #38bdf8; text-align: center; margin-top: 0; }
    .gallery-container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 1.5rem; margin-top: 1rem; }
    .video-card { background: #1e293b; padding: 1rem; border-radius: 12px; border: 1px solid #334155; }
    video { width: 100%; border-radius: 8px; background: #000; outline: none; }
    .admin-panel { background: #1e293b; border: 1px solid #0284c7; padding: 1.5rem; border-radius: 12px; width: 100%; max-width: 500px; margin-bottom: 2rem; display: none; }
    input, button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 6px; border: none; font-size: 14px; }
    input[type="password"], input[type="file"] { background: #334155; color: white; }
    button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    #status { margin-top: 10px; font-size: 14px; text-align: center; color: #38bdf8; font-weight: bold; }
    .no-videos { text-align: center; color: #94a3b8; font-size: 1.1rem; margin-top: 2rem; }
  </style>
</head>
<body>

  <div class="admin-panel" id="adminPanel">
    <h2>Admin Upload</h2>
    <form id="uploadForm">
      <input type="file" id="videoInput" accept="video/*" required />
      <input type="password" id="passwordInput" placeholder="Enter Admin Password" required />
      <button type="submit" id="uploadBtn">Upload Video</button>
    </form>
    <div id="status"></div>
  </div>

  <h1>Team Garuda Videos</h1>
  <div class="gallery-container" id="videoGallery">
    <div class="no-videos">Loading videos...</div>
  </div>

  <script>
    const adminPanel = document.getElementById('adminPanel');
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('videoInput');
    const passwordInput = document.getElementById('passwordInput');
    const status = document.getElementById('status');
    const gallery = document.getElementById('videoGallery');
    const uploadBtn = document.getElementById('uploadBtn');

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      adminPanel.style.display = 'block';
    }

    async function loadVideos() {
      try {
        const res = await fetch('/videos');
        const urls = await res.json();
        if (!Array.isArray(urls) || urls.length === 0) {
          gallery.innerHTML = '<div class="no-videos">No videos uploaded yet.</div>';
          return;
        }
        gallery.innerHTML = '';
        urls.forEach(url => {
          const card = document.createElement('div');
          card.className = 'video-card';
          const video = document.createElement('video');
          video.src = url;
          video.controls = true;
          card.appendChild(video);
          gallery.appendChild(card);
        });
      } catch (err) {
        gallery.innerHTML = '<div class="no-videos">Error loading videos.</div>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      status.style.color = '#38bdf8';
      status.innerText = 'Verifying admin authorization...';
      uploadBtn.disabled = true;

      try {
        // 1. Verify Password with Render
        const verifyRes = await fetch('/verify-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });
        const verifyData = await verifyRes.json();

        if (!verifyRes.ok) {
          status.style.color = '#ef4444';
          status.innerText = verifyData.error || 'Password verification failed.';
          uploadBtn.disabled = false;
          return;
        }

        // 2. Direct Upload from Browser to Cloudinary
        status.innerText = 'Uploading video... Please keep this page open.';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'garuda_preset');

        const cloudName = verifyData.cloudName;
        const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/video/upload`, {
          method: 'POST',
          body: formData
        });

        const uploadData = await uploadRes.json();

        if (uploadRes.ok) {
          status.style.color = '#22c55e';
          status.innerText = 'Upload successful!';
          passwordInput.value = '';
          fileInput.value = '';
          setTimeout(loadVideos, 1500);
        } else {
          status.style.color = '#ef4444';
          status.innerText = 'Upload Failed: ' + (uploadData.error?.message || 'Check Cloudinary preset name.');
        }
      } catch (err) {
        status.style.color = '#ef4444';
        status.innerText = 'Network error during upload. Verify connection and try again.';
      } finally {
        uploadBtn.disabled = false;
      }
    });

    loadVideos();
  </script>
</body>
</html>
